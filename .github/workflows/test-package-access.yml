name: Final Telegraph generation and validation

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: read

jobs:
  generate-validate-and-publish:
    name: Generate patches, validate Telegraph metadata, then publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify GitHub auth variables are available
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          if [ -z "$GITHUB_TOKEN" ] || [ -z "$GITHUB_ACTOR" ]; then
            echo "::error::Missing GITHUB_TOKEN or GITHUB_ACTOR."
            exit 1
          fi
          echo "GitHub Packages authentication variables are present (values hidden)."

      - name: Run canonical Gradle generation task
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          ./gradlew generatePatchesList --no-daemon --stacktrace

      - name: Validate generated artifacts and metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 <<'PY'
          import json
          import pathlib
          import re
          import sys

          root = pathlib.Path('.')
          required_files = [
              'patches-list.json',
              'PATCHES.md',
              'patches-bundle.json',
              'SHA256SUMS.txt',
          ]

          missing = [p for p in required_files if not (root / p).exists()]
          if missing:
              print(f'::error::Missing required generated files: {", ".join(missing)}')
              sys.exit(1)

          data = json.loads((root / 'patches-list.json').read_text(encoding='utf-8'))
          patches = data.get('patches', [])

          if not patches:
              print('::error::patches-list.json has no patches entries after generation.')
              sys.exit(1)

          all_compatible_packages = []
          for patch in patches:
              compatible_packages = patch.get('compatiblePackages') or []
              if not isinstance(compatible_packages, list):
                  print(f'::error::Patch {patch.get("name", "<unknown>")} has incompatible compatiblePackages value: {compatible_packages!r}')
                  sys.exit(1)
              all_compatible_packages.extend(compatible_packages)

          unique_packages = sorted({cp.get('packageName') for cp in all_compatible_packages if cp and cp.get('packageName')})

          print(f'Generated unique package names: {unique_packages}')

          # Fail if any old target compatibility remains in generated metadata.
          old_target_packages = ['org.telegram.messenger', 'org.telegram.messenger.web', 'org.telegram.plus']
          offending = [cp for cp in all_compatible_packages if cp.get('packageName') in old_target_packages]
          if offending:
              bad = ', '.join(sorted({cp['packageName'] for cp in offending}))
              print(f'::error::Legacy target compatibility still present in generated metadata: {bad}')
              sys.exit(1)

          # Ensure all remaining target compatibility entries are Telegraph-only.
          non_telegraph = [cp for cp in all_compatible_packages if cp.get('packageName') not in ('ir.ilmili.telegraph',)]
          if non_telegraph:
              bad = ', '.join(sorted({cp['packageName'] for cp in non_telegraph if cp.get('packageName')}))
              print(f'::error::Unexpected target compatibility packages remain in generated metadata: {bad}')
              sys.exit(1)

          telegraph_entries = [cp for cp in all_compatible_packages if cp and cp.get('packageName') == 'ir.ilmili.telegraph']
          if not telegraph_entries:
              print('::error::No Telegraph target compatibility entries were found in patches-list.json.')
              sys.exit(1)

          expected_version = '12.10.1.0'
          expected_version_code = 70382

          print(f'Telegraph package = {telegraph_entries[0].get("packageName")}')
          print(f'Telegraph version = {expected_version}')
          print(f'Telegraph versionCode = {expected_version_code}')

          for cp in telegraph_entries:
              targets = cp.get('targets', [])
              if not targets:
                  print(f'::error::Telegraph entry for {cp.get("name")} has no targets in patches-list.json.')
                  sys.exit(1)

              for target in targets:
                  version = target.get('version')
                  if version != expected_version:
                      print(f'::error::Unexpected Telegraph target version {version!r}; expected {expected_version!r}.')
                      sys.exit(1)

                  version_codes = target.get('versionCodes', {})
                  if not version_codes:
                      print('::error::Telegraph target has no versionCodes entries.')
                      sys.exit(1)

                  bad_codes = {arch: code for arch, code in version_codes.items() if int(code) != expected_version_code}
                  if bad_codes:
                      print(f'::error::Unexpected versionCode values for Telegraph target: {bad_codes}')
                      sys.exit(1)

          # Validate generated text files using each file's actual schema/content.
          # patches-list.json is the authoritative source for package/version/versionCode metadata.
          if not isinstance(data.get('version'), str) or not data['version']:
              print('::error::patches-list.json is missing a valid version field.')
              sys.exit(1)

          # patches-bundle.json is a release bundle and does not contain per-patch target metadata.
          bundle_data = json.loads((root / 'patches-bundle.json').read_text(encoding='utf-8'))
          if 'version' in bundle_data and not isinstance(bundle_data.get('version'), str):
              print('::error::patches-bundle.json contains an invalid version field.')
              sys.exit(1)

          patches_md_text = (root / 'PATCHES.md').read_text(encoding='utf-8')
          if not patches_md_text.strip().startswith('# Patches'):
              print('::error::PATCHES.md does not start with the expected generated header.')
              sys.exit(1)

          # PATCHES.md is generated documentation, not the authoritative patch source.
          # It is built from patches-list.json by .github/scripts/generate_patches_readme.py,
          # and its structure is a global app index/reference. Validate the generated doc
          # shape and its legacy-package exclusions, but do not assume it must contain only
          # a single app section or exactly match the Telegraph patch identities.
          if 'Generated from `patches-list.json`' not in patches_md_text:
              print('::error::PATCHES.md does not appear to be generated from patches-list.json.')
              sys.exit(1)

          if 'back to [README](README.md)' not in patches_md_text:
              print('::error::PATCHES.md is missing the expected README backlink marker.')
              sys.exit(1)

          # Reject old package names anywhere in generated metadata text.
          for file_name in ['patches-list.json', 'PATCHES.md', 'patches-bundle.json']:
              text = (root / file_name).read_text(encoding='utf-8')
              for old_name in ['org.telegram.messenger.web', 'org.telegram.plus', 'org.telegram.messenger']:
                  if old_name in text:
                      print(f'::error::{file_name} still contains legacy target compatibility string: {old_name}')
                      sys.exit(1)

          # Count final Telegraph patches.
          telegram_patch_count = len(
              [
                  p
                  for p in patches
                  if any(
                      cp and cp.get('packageName') == 'ir.ilmili.telegraph'
                      for cp in (p.get('compatiblePackages') or [])
                  )
              ]
          )

          print(f'Final Telegram/Telegraph patch count: {telegram_patch_count}')
          print('All required Telegraph target compatibility validations passed.')
          PY

      - name: Verify generated files changed
        run: |
          if [ -z "$(git status --porcelain -- patches-list.json PATCHES.md patches-bundle.json SHA256SUMS.txt)" ]; then
            echo '::error::Generated artifacts did not change after running generation.'
            exit 1
          fi
          echo 'Generated artifacts changed as expected.'

      - name: Skip commit/push until final manual approval
        run: |
          echo 'Validation-only workflow run completed successfully.'
          echo 'Skipping commit/push and temporary workflow cleanup until the run is approved manually.'

      - name: Skip temporary workflow cleanup until final manual approval
        run: |
          echo 'Skipping temporary workflow removal for now so the validation-only workflow remains available for reruns.'

name: Test GitHub Packages access

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  test-package-access:
    name: Test app.morphe.patches resolution
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify token is available without printing it
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          if [ -z "$GITHUB_TOKEN" ]; then
            echo "::error::GITHUB_TOKEN is empty."
            exit 1
          fi
          echo "GITHUB_TOKEN is present (value hidden)."

      - name: Resolve Morphe Gradle plugin with GitHub Packages auth
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          ./gradlew help --no-daemon --stacktrace
